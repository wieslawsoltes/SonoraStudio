name: Validate and deploy Sonora Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run core tests
        run: npm test
      - name: Build standalone application
        run: npm run build
      - name: Install browser test runner
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run real-browser integration tests
        run: npm run test:browser
      - name: Stage GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp dist/sonora-studio.html site/index.html
          cp dist/sonora-studio.html site/sonora-studio.html
          touch site/.nojekyll
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const html = fs.readFileSync('site/index.html');
          fs.writeFileSync('site/build-info.json', JSON.stringify({
            name: p.name,
            version: p.version,
            commit: process.env.GITHUB_SHA,
            entrypointSha256: createHash('sha256').update(html).digest('hex')
          }, null, 2) + '\n');
          JS
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published revision and application checksum
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          sha = os.environ['EXPECTED_SHA']
          for attempt in range(18):
              try:
                  def fetch(path):
                      request = urllib.request.Request(base + path + '?revision=' + sha,
                          headers={'Cache-Control': 'no-cache', 'User-Agent': 'SonoraStudio-deployment-check'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read()
                  info = json.loads(fetch('build-info.json'))
                  if info.get('name') != 'sonora-studio' or info.get('commit') != sha:
                      raise RuntimeError('Published revision has not propagated yet')
                  html = fetch('index.html')
                  if hashlib.sha256(html).hexdigest() != info.get('entrypointSha256'):
                      raise RuntimeError('Published application checksum does not match the build')
                  if b'Sonora' not in html or b'AudioContext' not in html:
                      raise RuntimeError('Published HTML does not contain the application')
                  print(f'Verified {base}: commit {sha}, {len(html)} HTML bytes, SHA-256 {info["entrypointSha256"]}')
                  break
              except Exception as error:
                  if attempt == 17:
                      raise
                  print(f'Publish check {attempt + 1}: {error}', flush=True)
                  time.sleep(5)
          PY
